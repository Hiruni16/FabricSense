<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FabricSense</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --accent-light: #ff6b81;
            --text-dark: #333;
        }

        /* FIXED BODY (SCROLL ENABLED) */
        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-y: auto;
        }

        /* Background glow */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(233, 69, 96, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 107, 129, 0.1), transparent 50%);
            pointer-events: none;
        }

        /* Decorative circles */
        .decorative-circle {
            position: absolute;
            border-radius: 50%;
            border: 2px solid rgba(233, 69, 96, 0.3);
            background: rgba(233, 69, 96, 0.1);
            animation: float 20s linear infinite;
        }

        .circle1 { width: 120px; height: 120px; top: 5%; left: 5%; }
        .circle2 { width: 150px; height: 150px; top: 50%; right: 5%; animation-delay: -7s; }
        .circle3 { width: 90px; height: 90px; bottom: 10%; left: 20%; animation-delay: -14s; }

        @keyframes float {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(20px,-30px); }
        }

        .login-container {
            background: rgba(255,255,255,0.98);
            padding: 3rem;
            border-radius: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
            z-index: 2;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .8rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #fff;
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            margin-bottom: .3rem;
        }

        .logo-section p {
            color: #666;
        }

        .error-message {
            display: none;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.1) 0%, rgba(255, 107, 129, 0.1) 100%);
            border: 2px solid rgba(233, 69, 96, 0.3);
            color: #c92a49;
            padding: 1rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 600;
        }

        .error-message.show {
            display: block;
            animation: fadeInUp 0.5s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.4rem;
        }

        label {
            font-weight: 600;
            margin-bottom: .4rem;
            display: block;
            color: var(--text-dark);
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid #e1e8ed;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(233,69,96,.15);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            font-size: 0.9rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
        }

        .remember-me label {
            color: #666;
            cursor: pointer;
            font-weight: 500;
            margin: 0;
        }

        .forgot-password {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .forgot-password::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .forgot-password:hover {
            color: var(--accent-light);
        }

        .forgot-password:hover::after {
            width: 100%;
        }

        .login-btn {
            width: 100%;
            padding: 1.2rem;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(233,69,96,.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(233,69,96,.45);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            text-align: center;
            margin: 1.8rem 0;
            color: #999;
            font-weight: 500;
        }

        .admin-link {
            text-align: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.05) 0%, rgba(255, 107, 129, 0.05) 100%);
            border-radius: 15px;
            border: 2px solid rgba(233, 69, 96, 0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 1rem;
        }

        .admin-link:hover {
            border-color: rgba(233, 69, 96, 0.3);
            background: linear-gradient(135deg, rgba(233, 69, 96, 0.08) 0%, rgba(255, 107, 129, 0.08) 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.1);
        }

        .admin-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .signup-link, .back-home {
            text-align: center;
            margin-top: 1rem;
        }

        .signup-link a, .back-home a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .signup-link a::after, .back-home a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent) 0%, var(--accent-light) 100%);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .signup-link a:hover, .back-home a:hover {
            color: var(--accent-light);
        }

        .signup-link a:hover::after, .back-home a:hover::after {
            width: 100%;
        }

        @media (max-width: 600px) {
            .login-container {
                padding: 2rem;
            }

            .form-options {
                flex-direction: column;
                gap: 0.8rem;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <div class="decorative-circle circle1"></div>
    <div class="decorative-circle circle2"></div>
    <div class="decorative-circle circle3"></div>

    <div class="login-container">
        <div class="logo-section">
            <div class="logo-container">
                <div class="logo-text">FabricSense</div>
            </div>
            <h1>Welcome Back</h1>
            <p>Log in to continue your fabric journey</p>
        </div>

        <div class="error-message" id="errorMessage">
            Invalid email or password. Please try again.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="form-options">
                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password" onclick="event.preventDefault();">Forgot Password?</a>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="divider">or</div>

        <div class="admin-link">
            <a href="adminLogin.html">🔐 Admin Login</a>
        </div>

        <div class="signup-link">
            Don't have an account? <a href="userSignup.html">Sign up</a>
        </div>

        <div class="back-home">
            <a href="index.html">← Back to Home</a>
        </div>
    </div>

    <script>
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const formData = new FormData(this);
    const errorMessage = document.getElementById('errorMessage');

    fetch("login.php", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "success") {
            window.location.href = "loginHomePage.html";
        } else {
            errorMessage.textContent = data.message;
            errorMessage.classList.add('show');

            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 3000);
        }
    })
    .catch(() => {
        errorMessage.textContent = "Unable to connect to server";
        errorMessage.classList.add('show');
    });
});
</script>


</body>
</html>
